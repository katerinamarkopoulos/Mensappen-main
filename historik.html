<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blomstra – Menshistorik</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js"></script>
</head>
<body>
  <div class="phone">
    <main class="screen">
      <a class="kronblad-badge" href="kronblad.html" aria-label="Kronblad – dina poäng">
        <svg class="lotus" viewBox="0 0 40 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 28C12.5 22.5 12.5 11.5 20 4c7.5 7.5 7.5 18.5 0 24z"/><path d="M20 28C10 28 4 22 4 10c4.5 1 8 2.8 10.6 5.8"/><path d="M20 28c10 0 16-6 16-18-4.5 1-8 2.8-10.6 5.8"/></svg>
        <span>Kronblad</span>
      </a>
      <a class="back" href="kalender.html">← Kalender</a>
      <h1 class="h1">Menshistorik</h1>
      <p class="lead small" style="font-size:15px;margin-top:6px">Allt du loggat, nyast först.</p>

      <div class="stats history-stats">
        <div class="card stat"><small>Mensen varar</small><strong data-hist-period>–</strong><small data-hist-period-avg></small></div>
        <div class="card stat"><small>Cykellängd</small><strong data-hist-cycle>–</strong><small data-hist-cycle-avg></small></div>
      </div>

      <div class="history-legend" aria-hidden="true">
        <span><i class="hl-period"></i>Mensdagar</span>
        <span><i class="hl-est"></i>Uppskattat</span>
        <span><i class="hl-cycle"></i>Resten av cykeln</span>
      </div>

      <div class="period-list" data-full-history></div>

      <a class="btn btn-outline history-log" href="logga.html?typ=mens">Logga mens</a>
    </main>

    <nav class="tabbar" aria-label="Huvudmeny">
      <a class="tab" href="index.html">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="14" cy="8" r="4"/><circle cx="7.5" cy="19" r="4"/><circle cx="20.5" cy="19" r="4"/></svg>
        <span>Översikt</span>
      </a>
      <a class="tab" href="kalender.html" aria-current="page">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="5.5" width="20" height="18" rx="2.5"/><path d="M4 11h20M9.5 3v5M18.5 3v5"/><g fill="currentColor" stroke="none"><circle cx="9.5" cy="15" r="1.2"/><circle cx="14" cy="15" r="1.2"/><circle cx="18.5" cy="15" r="1.2"/><circle cx="9.5" cy="19.3" r="1.2"/><circle cx="14" cy="19.3" r="1.2"/><circle cx="18.5" cy="19.3" r="1.2"/></g></svg>
        <span>Kalender</span>
      </a>
      <a class="tab" href="leverans.html">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 7h11v12H8M19 11h4l3 4v4h-7"/><circle cx="11" cy="20.5" r="2.2"/><circle cx="22" cy="20.5" r="2.2"/><path d="M2 10h6M3 14h5M4 18h3"/></svg>
        <span>Leverans</span>
      </a>
      <a class="tab" href="profil.html">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="14" cy="14" r="11"/><circle cx="14" cy="11.5" r="4"/><path d="M6.8 22.2c1.6-3 4.2-4.4 7.2-4.4s5.6 1.4 7.2 4.4"/></svg>
        <span>Profil</span>
      </a>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
